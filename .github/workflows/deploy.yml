name: Deploy Arketype

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ARKETYPE_SSH_KEY }}
          SSH_HOST: ${{ secrets.ARKETYPE_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy static site
        env:
          SSH_HOST: ${{ secrets.ARKETYPE_HOST }}
          SSH_USER: ${{ secrets.ARKETYPE_USER }}
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'deploy/' \
            ./ "$SSH_USER@$SSH_HOST:/var/www/arketype/current/"
